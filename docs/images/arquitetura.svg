<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="430" viewBox="0 0 1120 430" role="img" aria-labelledby="title description">
  <title id="title">Arquitetura do SQM Qualidade</title>
  <desc id="description">Analistas acessam a interface web, servida pela API Node.js. A API consulta o MySQL e agenda a sincronização de funcionários.</desc>
  <defs>
    <linearGradient id="background" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eaf2ff"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" x2="1">
      <stop offset="0" stop-color="#1d4ed8"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#64748b"/>
    </marker>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0f172a" flood-opacity=".10"/>
    </filter>
  </defs>
  <rect width="1120" height="430" rx="24" fill="url(#background)"/>
  <text x="560" y="48" text-anchor="middle" fill="#0f172a" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700">SQM Qualidade · visão da aplicação</text>
  <text x="560" y="75" text-anchor="middle" fill="#475569" font-family="Segoe UI, Arial, sans-serif" font-size="14">Consulta individual do histórico de avaliações e sincronização de usuários</text>

  <g filter="url(#shadow)">
    <rect x="48" y="143" width="215" height="165" rx="18" fill="#fff"/>
    <rect x="48" y="143" width="215" height="9" rx="5" fill="#0ea5e9"/>
    <circle cx="155" cy="190" r="22" fill="#e0f2fe"/>
    <path d="M155 176a9 9 0 1 0 0 18 9 9 0 0 0 0-18zm-17 34c1-9 7-14 17-14s16 5 17 14" fill="none" stroke="#0369a1" stroke-width="3" stroke-linecap="round"/>
    <text x="155" y="245" text-anchor="middle" fill="#0f172a" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">Analistas</text>
    <text x="155" y="270" text-anchor="middle" fill="#475569" font-family="Segoe UI, Arial, sans-serif" font-size="13">Navegador na intranet</text>
    <text x="155" y="290" text-anchor="middle" fill="#475569" font-family="Segoe UI, Arial, sans-serif" font-size="12">Login · filtros · exportação</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="449" y="119" width="250" height="213" rx="18" fill="#fff"/>
    <rect x="449" y="119" width="250" height="9" rx="5" fill="url(#blue)"/>
    <rect x="531" y="157" width="86" height="48" rx="10" fill="#dbeafe"/>
    <path d="M549 180h50m-42-10h34m-34 20h25" stroke="#1d4ed8" stroke-width="4" stroke-linecap="round"/>
    <text x="574" y="238" text-anchor="middle" fill="#0f172a" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">Backend Node.js</text>
    <text x="574" y="263" text-anchor="middle" fill="#475569" font-family="Segoe UI, Arial, sans-serif" font-size="13">Express · API REST</text>
    <text x="574" y="284" text-anchor="middle" fill="#475569" font-family="Segoe UI, Arial, sans-serif" font-size="13">Autenticação · histórico</text>
    <text x="574" y="305" text-anchor="middle" fill="#475569" font-family="Segoe UI, Arial, sans-serif" font-size="13">Agendador do robô (cron)</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="857" y="143" width="215" height="165" rx="18" fill="#fff"/>
    <rect x="857" y="143" width="215" height="9" rx="5" fill="#22c55e"/>
    <ellipse cx="964" cy="180" rx="30" ry="11" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
    <path d="M934 180v28c0 6 13 11 30 11s30-5 30-11v-28m-60 14c0 6 13 11 30 11s30-5 30-11" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
    <text x="964" y="245" text-anchor="middle" fill="#0f172a" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">MySQL</text>
    <text x="964" y="270" text-anchor="middle" fill="#475569" font-family="Segoe UI, Arial, sans-serif" font-size="13">Funcionários e logins</text>
    <text x="964" y="290" text-anchor="middle" fill="#475569" font-family="Segoe UI, Arial, sans-serif" font-size="12">Avaliações · critérios</text>
  </g>

  <path d="M275 223h155" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="352" y="209" text-anchor="middle" fill="#475569" font-family="Segoe UI, Arial, sans-serif" font-size="12">HTTP · porta 3002</text>
  <path d="M711 223h130" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="776" y="209" text-anchor="middle" fill="#475569" font-family="Segoe UI, Arial, sans-serif" font-size="12">SQL</text>

  <rect x="250" y="363" width="620" height="40" rx="20" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="560" y="388" text-anchor="middle" fill="#1e40af" font-family="Segoe UI, Arial, sans-serif" font-size="13">Sincronização automática ou manual de funcionários ativos sem login</text>
</svg>
